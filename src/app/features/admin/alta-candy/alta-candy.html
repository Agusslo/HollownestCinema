<form class="candy-form admin-form" [formGroup]="formulario" (ngSubmit)="guardar()">
  <div class="form-header">
    <img class="admin-flea" src="/img/flea.gif" alt="" aria-hidden="true" />
    <span class="form-kicker">Panel de administración</span>
    <h1>Nuevo producto de candy bar</h1>
    <div class="admin-ornamento" aria-hidden="true"><span></span>◆<span></span></div>
    <p>Cargá un producto nuevo para que aparezca en la compra de candy junto a la entrada.</p>
  </div>

  <div class="form-fields">
    <label>
      Nombre
      <input type="text" formControlName="nombre" placeholder="Ej: Pochoclo grande" />
      @if (formulario.controls.nombre.touched && formulario.controls.nombre.invalid) {
        <span class="campo-error">El nombre es obligatorio.</span>
      }
    </label>

    <label>
      Precio
      <input type="number" formControlName="precio" min="0" />
      @if (formulario.controls.precio.touched && formulario.controls.precio.invalid) {
        <span class="campo-error">Tiene que ser un número mayor o igual a 0.</span>
      }
    </label>

    <label>
      Categoría
      <select formControlName="categoria_id">
        <option [value]="null" disabled>Elegí una categoría</option>
        @for (categoria of categorias(); track categoria.id) {
          <option [value]="categoria.id">{{ categoria.nombre }}</option>
        }
      </select>
      @if (formulario.controls.categoria_id.touched && formulario.controls.categoria_id.invalid) {
        <span class="campo-error">Elegí una categoría.</span>
      }
    </label>

    <label>
      Imagen (URL, opcional)
      <input type="text" formControlName="imagen_url" placeholder="https://..." />
      @if (formulario.controls.imagen_url.touched && formulario.controls.imagen_url.invalid) {
        <span class="campo-error">Tiene que ser un link que empiece con http:// o https://.</span>
      }
    </label>

    <label>
      Puntos para canjear (opcional)
      <input
        type="number"
        formControlName="puntos_canje"
        min="0"
        placeholder="Vacío = no se puede canjear con puntos"
      />
      @if (formulario.controls.puntos_canje.touched && formulario.controls.puntos_canje.invalid) {
        <span class="campo-error">Tiene que ser un número mayor o igual a 0.</span>
      }
    </label>
  </div>

  @if (formulario.invalid && formulario.touched) {
    <p class="form-error">Faltan completar campos: revisá los que están marcados en rojo.</p>
  }

  @if (mensaje()) {
    <p class="mensaje">{{ mensaje() }}</p>
  }

  <button type="submit" class="submit-button" appGlowHover [disabled]="guardando()">
    <span>{{ guardando() ? 'Guardando...' : 'Agregar producto' }}</span>
    <span aria-hidden="true">&rarr;</span>
  </button>
</form>
