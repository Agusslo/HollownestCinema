@if (cargando()) {
  <p>Cargando cartelera...</p>
} @else if (peliculas().length === 0) {
  <p>Todavía no hay películas cargadas.</p>
} @else {
  <ul>
    @for (pelicula of peliculas(); track pelicula.id) {
      <li><a [routerLink]="['/peliculas', pelicula.id]">{{ pelicula.nombre }}</a></li>
    }
  </ul>
}
