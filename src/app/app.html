<header class="nav-header">
  <a class="logo" [routerLink]="['/']">
    <img class="logo-icon" src="/img/The_Knight.png" alt="The Knight" />
    <span class="logo-text">Hollownest Cinema</span>
  </a>

  <nav class="nav-links">
    <a class="nav-item" [routerLink]="['/']">Cartelera</a>
    <button
      class="nav-item theme-toggle"
      type="button"
      (click)="alternarTema()"
      [attr.aria-label]="temaClaro() ? 'Usar fondo oscuro' : 'Usar fondo claro'"
      [attr.aria-pressed]="temaClaro()"
    >
      <span aria-hidden="true">{{ temaClaro() ? '☾' : '☀' }}</span>
      {{ temaClaro() ? 'Oscuro' : 'Claro' }}
    </button>

    @if (!cargandoAuth()) {
      @if (usuario(); as u) {
        <span class="nav-item user-badge">
          <span class="soul-orb" aria-hidden="true"></span>
          {{ u.nombre }}
        </span>
        <button class="nav-item" type="button" (click)="cerrarSesion()">Salir</button>
      } @else {
        <span class="nav-item user-badge shade">Sombra</span>
        <a class="nav-item" [routerLink]="['/login']">Ingresar</a>
        <a class="nav-item nav-primary" [routerLink]="['/registro']">Registrarme</a>
      }
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

<div class="bug-container">
  <img src="/img/bug.gif" alt="" class="sad-bug" aria-hidden="true" />
</div>
