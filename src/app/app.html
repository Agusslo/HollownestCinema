<header class="nav-header">
  <a class="logo" [routerLink]="['/']">
    <img class="logo-icon" src="/img/The_Knight.png" alt="The Knight" />
    <span class="logo-text">Hollownest Cinema</span>
  </a>

  <nav class="nav-links">
    <a class="nav-item" [routerLink]="['/']">Cartelera</a>
    <button
      class="nav-item theme-toggle"
      type="button"
      (click)="alternarTema()"
      [attr.aria-label]="temaClaro() ? 'Usar fondo oscuro' : 'Usar fondo claro'"
      [attr.aria-pressed]="temaClaro()"
    >
      <span aria-hidden="true">{{ temaClaro() ? '☾' : '☀' }}</span>
      {{ temaClaro() ? 'Oscuro' : 'Claro' }}
    </button>

    @if (!cargandoAuth()) {
      @if (usuario(); as u) {
        <div class="nav-item user-badge">
          <app-blobatar [name]="u.nombre" [size]="32" animate="hover" class="user-blobatar" />
          <span class="user-nombre">{{ u.nombre }}</span>
        </div>
        <a class="nav-item" [routerLink]="['/mis-compras']">Mis compras</a>
        <button class="nav-item btn-salir" type="button" (click)="cerrarSesion()">Salir</button>
      } @else {
        <div class="nav-item user-badge shade">
          <app-blobatar
            name="Sombra"
            [size]="32"
            animate="hover"
            class="user-blobatar shade-blobatar"
          />
          <span class="user-nombre">Sombra</span>
        </div>
        <a class="nav-item" [routerLink]="['/login']">Ingresar</a>
        <a class="nav-item nav-primary" [routerLink]="['/registro']">Registrarme</a>
      }
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

<div class="bug-container">
  <img src="/img/bug.gif" alt="" class="sad-bug" aria-hidden="true" />
</div>
